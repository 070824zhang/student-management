<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生信息管理系统</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2333;
    --border: #2a3045;
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --success: #3ecf8e;
    --danger: #f75f5f;
    --warn: #f7c34f;
    --text: #e8eaf0;
    --text2: #8b92a8;
    --text3: #555e78;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    padding: 0;
  }

  /* 顶部标题栏 */
  .header {
    background: linear-gradient(135deg, #1a1f2e 0%, #12151f 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #e8eaf0, #8b92a8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-sub {
    margin-left: auto;
    font-size: 12px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }
  .total-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }

  /* 主布局 */
  .main {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 83px);
  }

  /* 侧边栏 */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 0;
  }
  .nav-section {
    padding: 0 20px;
    margin-bottom: 8px;
  }
  .nav-label {
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 2px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 8px;
    padding: 0 12px;
  }
  .nav-btn {
    width: 100%;
    background: none;
    border: none;
    color: var(--text2);
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    font-family: 'Noto Serif SC', serif;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.15s;
    margin-bottom: 2px;
  }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active {
    background: linear-gradient(135deg, rgba(79,142,247,0.15), rgba(124,92,252,0.15));
    color: var(--accent);
    border: 1px solid rgba(79,142,247,0.2);
  }
  .nav-btn .icon {
    width: 30px; height: 30px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    background: var(--surface2);
  }
  .nav-btn.active .icon {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  .nav-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 20px;
  }

  /* 内容区 */
  .content {
    padding: 32px 40px;
    overflow-y: auto;
  }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.2s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-title span { font-size: 20px; }
  .panel-desc {
    color: var(--text2);
    font-size: 13px;
    margin-bottom: 28px;
  }

  /* 表单卡片 */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 24px;
  }
  .card-title {
    font-size: 13px;
    color: var(--text3);
    letter-spacing: 1px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label {
    font-size: 12px;
    color: var(--text2);
    letter-spacing: 0.5px;
  }
  input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Serif SC', serif;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
  }
  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
  }
  input::placeholder { color: var(--text3); }
  select option { background: var(--surface2); }

  .btn {
    padding: 10px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
  }
  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-danger {
    background: rgba(247,95,95,0.12);
    color: var(--danger);
    border: 1px solid rgba(247,95,95,0.2);
  }
  .btn-danger:hover { background: rgba(247,95,95,0.2); }
  .btn-warn {
    background: rgba(247,195,79,0.12);
    color: var(--warn);
    border: 1px solid rgba(247,195,79,0.2);
  }
  .btn-warn:hover { background: rgba(247,195,79,0.2); }
  .btn-ghost {
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); }

  /* 通知 */
  .toast-container {
    position: fixed;
    top: 100px;
    right: 24px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    animation: slideIn 0.25s ease;
    min-width: 220px;
  }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--accent); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* 表格 */
  .table-wrap {
    overflow-x: auto;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead {
    background: var(--surface2);
  }
  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(42,48,69,0.5);
    color: var(--text2);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(79,142,247,0.04); color: var(--text); }
  .td-id {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text3);
    font-size: 12px;
  }
  .td-name { color: var(--text); font-weight: 600; }
  .gender-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
  }
  .gender-m { background: rgba(79,142,247,0.1); color: var(--accent); }
  .gender-f { background: rgba(124,92,252,0.1); color: #b494fc; }
  .gender-other { background: var(--surface2); color: var(--text3); }

  .action-btns { display: flex; gap: 6px; }
  .btn-sm {
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 6px;
  }

  /* 查询结果卡片 */
  .result-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: none;
  }
  .result-card.show { display: block; animation: fadeIn 0.2s ease; }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .result-item { display: flex; flex-direction: column; gap: 4px; }
  .result-label {
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .result-val {
    font-size: 16px;
    color: var(--text);
    font-weight: 600;
  }
  .result-id { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 22px; }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 14px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  /* 搜索栏 */
  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    align-items: center;
  }
  .search-bar input { max-width: 260px; }

  /* 编辑模态框 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 480px;
    max-width: 95vw;
    animation: fadeIn 0.2s ease;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { color: var(--text); }

  /* 确认删除 */
  .confirm-box {
    background: rgba(247,95,95,0.06);
    border: 1px solid rgba(247,95,95,0.15);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 10px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🎓</div>
  <h1>学生信息管理系统</h1>
  <div style="margin-left:auto;display:flex;align-items:center;gap:12px;">
    <span class="total-badge" id="totalBadge">共 0 名学生</span>
    <span class="header-sub">Student Management System</span>
  </div>
</div>

<div class="main">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="nav-section">
      <div class="nav-label">功能菜单</div>
      <button class="nav-btn active" onclick="showPanel('list')">
        <div class="icon">📋</div> 全部学生
      </button>
      <button class="nav-btn" onclick="showPanel('add')">
        <div class="icon">➕</div> 添加学生
      </button>
      <button class="nav-btn" onclick="showPanel('search')">
        <div class="icon">🔍</div> 查询学生
      </button>
    </div>
    <hr class="nav-divider">
    <div class="nav-section">
      <div class="nav-label">数据操作</div>
      <button class="nav-btn" onclick="exportData()">
        <div class="icon">💾</div> 导出数据
      </button>
      <button class="nav-btn" onclick="clearAll()">
        <div class="icon">🗑️</div> 清空数据
      </button>
    </div>
  </div>

  <!-- 内容区 -->
  <div class="content">

    <!-- 全部学生 -->
    <div class="panel active" id="panel-list">
      <div class="panel-title"><span>📋</span> 全部学生</div>
      <div class="panel-desc">管理所有学生信息，可进行编辑与删除操作</div>

      <div class="search-bar">
        <input type="text" id="filterInput" placeholder="按姓名筛选..." oninput="renderTable()">
        <button class="btn btn-ghost" onclick="document.getElementById('filterInput').value='';renderTable()">清除</button>
      </div>

      <div class="table-wrap">
        <table id="studentTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>姓名</th>
              <th>性别</th>
              <th>年龄</th>
              <th>家庭地址</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 添加学生 -->
    <div class="panel" id="panel-add">
      <div class="panel-title"><span>➕</span> 添加学生</div>
      <div class="panel-desc">填写学生基本信息，ID 将自动分配</div>

      <div class="card">
        <div class="card-title">学生信息</div>
        <div class="form-grid">
          <div class="form-group">
            <label>姓名 *</label>
            <input type="text" id="addName" placeholder="请输入姓名">
          </div>
          <div class="form-group">
            <label>性别 *</label>
            <select id="addGender">
              <option value="">请选择</option>
              <option value="男">男</option>
              <option value="女">女</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>年龄 *</label>
            <input type="number" id="addAge" placeholder="请输入年龄" min="1" max="150">
          </div>
          <div class="form-group">
            <label>家庭地址 *</label>
            <input type="text" id="addAddress" placeholder="请输入家庭地址">
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-primary" onclick="addStudent()">✓ 确认添加</button>
          <button class="btn btn-ghost" onclick="clearAddForm()">↺ 清空</button>
        </div>
      </div>
    </div>

    <!-- 查询学生 -->
    <div class="panel" id="panel-search">
      <div class="panel-title"><span>🔍</span> 查询学生</div>
      <div class="panel-desc">通过学生 ID 精确查询学生信息</div>

      <div class="card">
        <div class="card-title">输入查询条件</div>
        <div style="display:flex;gap:10px;align-items:flex-end;">
          <div class="form-group" style="flex:1;max-width:240px;">
            <label>学生 ID</label>
            <input type="number" id="searchId" placeholder="请输入学生ID" min="1">
          </div>
          <button class="btn btn-primary" onclick="searchStudent()">🔍 查询</button>
        </div>
      </div>

      <div class="result-card" id="resultCard">
        <div style="font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:1px;margin-bottom:4px;">查询结果</div>
        <div class="result-grid" id="resultGrid"></div>
      </div>
    </div>

  </div>
</div>

<!-- 编辑模态框 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">✏️ 修改学生信息</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="card-title">ID：<span id="editIdDisplay" style="color:var(--accent);font-family:'JetBrains Mono',monospace;"></span></div>
    <div class="form-grid" style="margin-top:16px;">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="editName">
      </div>
      <div class="form-group">
        <label>性别</label>
        <select id="editGender">
          <option value="男">男</option>
          <option value="女">女</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>年龄</label>
        <input type="number" id="editAge" min="1" max="150">
      </div>
      <div class="form-group">
        <label>家庭地址</label>
        <input type="text" id="editAddress">
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-primary" onclick="saveEdit()">✓ 保存修改</button>
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<!-- 删除确认模态框 -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="width:400px;">
    <div class="modal-header">
      <div class="modal-title">🗑️ 确认删除</div>
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <div class="confirm-box">
      ⚠️ 即将删除学生 <strong id="deleteStudentName" style="color:var(--text)"></strong>，此操作不可撤销。
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
      <button class="btn btn-ghost" onclick="closeDeleteModal()">取消</button>
    </div>
  </div>
</div>

<!-- Toast 通知 -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ========== 数据存储 ==========
let students = JSON.parse(localStorage.getItem('students') || '[]');
let nextId = students.length ? Math.max(...students.map(s => s.id)) + 1 : 1;
let deleteTargetId = null;

// ========== 初始化 ==========
renderTable();
updateBadge();

// ========== 导航 ==========
function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  if (name === 'list') renderTable();
}

// ========== 添加学生 ==========
function addStudent() {
  const name = document.getElementById('addName').value.trim();
  const gender = document.getElementById('addGender').value;
  const age = document.getElementById('addAge').value.trim();
  const address = document.getElementById('addAddress').value.trim();
  if (!name || !gender || !age || !address) {
    showToast('error', '请填写所有字段');
    return;
  }
  if (isNaN(age) || age < 1 || age > 150) {
    showToast('error', '请输入有效年龄（1-150）');
    return;
  }
  students.push({ id: nextId, name, gender, age: parseInt(age), address });
  saveData();
  nextId++;
  showToast('success', `学生「${name}」添加成功，ID=${nextId-1}`);
  clearAddForm();
  updateBadge();
}

function clearAddForm() {
  ['addName','addAge','addAddress'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('addGender').value = '';
}

// ========== 渲染表格 ==========
function renderTable() {
  const filter = (document.getElementById('filterInput')?.value || '').trim().toLowerCase();
  const filtered = filter ? students.filter(s => s.name.includes(filter)) : students;
  const tbody = document.getElementById('tableBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6">
      <div class="empty-state"><div class="empty-icon">🎓</div><p>${filter ? '未找到匹配的学生' : '暂无学生数据，请先添加'}</p></div>
    </td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(s => `
    <tr>
      <td class="td-id">#${String(s.id).padStart(3,'0')}</td>
      <td class="td-name">${escHtml(s.name)}</td>
      <td><span class="gender-badge ${s.gender==='男'?'gender-m':s.gender==='女'?'gender-f':'gender-other'}">${escHtml(s.gender)}</span></td>
      <td>${s.age} 岁</td>
      <td>${escHtml(s.address)}</td>
      <td>
        <div class="action-btns">
          <button class="btn btn-warn btn-sm" onclick="openEdit(${s.id})">✏️ 编辑</button>
          <button class="btn btn-danger btn-sm" onclick="openDelete(${s.id})">🗑️ 删除</button>
        </div>
      </td>
    </tr>`).join('');
}

// ========== 查询 ==========
function searchStudent() {
  const sid = parseInt(document.getElementById('searchId').value);
  if (!sid || isNaN(sid)) { showToast('error', '请输入有效的学生ID'); return; }
  const s = students.find(s => s.id === sid);
  const card = document.getElementById('resultCard');
  if (!s) { card.classList.remove('show'); showToast('error', `未找到 ID 为 ${sid} 的学生`); return; }
  document.getElementById('resultGrid').innerHTML = `
    <div class="result-item"><div class="result-label">ID</div><div class="result-val result-id">#${String(s.id).padStart(3,'0')}</div></div>
    <div class="result-item"><div class="result-label">姓名</div><div class="result-val">${escHtml(s.name)}</div></div>
    <div class="result-item"><div class="result-label">性别</div><div class="result-val">${escHtml(s.gender)}</div></div>
    <div class="result-item"><div class="result-label">年龄</div><div class="result-val">${s.age} 岁</div></div>
    <div class="result-item" style="grid-column:1/-1"><div class="result-label">家庭地址</div><div class="result-val">${escHtml(s.address)}</div></div>`;
  card.classList.add('show');
  showToast('success', `查询到学生：${s.name}`);
}

// ========== 编辑 ==========
function openEdit(sid) {
  const s = students.find(s => s.id === sid);
  if (!s) return;
  document.getElementById('editId').value = sid;
  document.getElementById('editIdDisplay').textContent = `#${String(sid).padStart(3,'0')}`;
  document.getElementById('editName').value = s.name;
  document.getElementById('editGender').value = s.gender;
  document.getElementById('editAge').value = s.age;
  document.getElementById('editAddress').value = s.address;
  document.getElementById('editModal').classList.add('open');
}
function closeModal() { document.getElementById('editModal').classList.remove('open'); }
function saveEdit() {
  const sid = parseInt(document.getElementById('editId').value);
  const name = document.getElementById('editName').value.trim();
  const gender = document.getElementById('editGender').value;
  const age = document.getElementById('editAge').value.trim();
  const address = document.getElementById('editAddress').value.trim();
  if (!name || !gender || !age || !address) { showToast('error', '所有字段均不能为空'); return; }
  const idx = students.findIndex(s => s.id === sid);
  if (idx === -1) return;
  students[idx] = { id: sid, name, gender, age: parseInt(age), address };
  saveData();
  closeModal();
  renderTable();
  showToast('success', `学生「${name}」信息已更新`);
}

// ========== 删除 ==========
function openDelete(sid) {
  const s = students.find(s => s.id === sid);
  if (!s) return;
  deleteTargetId = sid;
  document.getElementById('deleteStudentName').textContent = `${s.name}（ID: ${sid}）`;
  document.getElementById('deleteModal').classList.add('open');
}
function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('open');
  deleteTargetId = null;
}
function confirmDelete() {
  if (!deleteTargetId) return;
  const s = students.find(s => s.id === deleteTargetId);
  students = students.filter(s => s.id !== deleteTargetId);
  saveData();
  closeDeleteModal();
  renderTable();
  updateBadge();
  showToast('success', `已删除学生「${s?.name || ''}」`);
}

// ========== 工具函数 ==========
function saveData() { localStorage.setItem('students', JSON.stringify(students)); }
function updateBadge() {
  document.getElementById('totalBadge').textContent = `共 ${students.length} 名学生`;
}
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(type, msg) {
  const icon = { success:'✅', error:'❌', info:'ℹ️' }[type] || 'ℹ️';
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ========== 导出 ==========
function exportData() {
  if (!students.length) { showToast('error', '暂无数据可导出'); return; }
  const rows = ['ID,姓名,性别,年龄,家庭地址',
    ...students.map(s => `${s.id},${s.name},${s.gender},${s.age},${s.address}`)];
  const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'students.csv';
  a.click();
  showToast('success', '数据已导出为 students.csv');
}

function clearAll() {
  if (!students.length) { showToast('error', '暂无数据'); return; }
  if (!confirm(`确定要清空全部 ${students.length} 条学生数据吗？此操作不可撤销。`)) return;
  students = [];
  nextId = 1;
  saveData();
  renderTable();
  updateBadge();
  showToast('success', '已清空全部数据');
}

// 点击遮罩关闭弹窗
document.getElementById('editModal').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});
document.getElementById('deleteModal').addEventListener('click', function(e){
  if (e.target === this) closeDeleteModal();
});
</script>
</body>
